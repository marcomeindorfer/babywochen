<meta name="theme-color" content="#141a26" media="(prefers-color-scheme: dark)">

<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* Layout: ein Bilderbuch-Himmel oben (Phase der Woche als Wetter), darunter sechs farbige Fragekarten; feste Leiste unten mit vier Bereichen. */
:root{
  --bg:#f2f6fb; --surface:#ffffff; --ink:#26324a; --muted:#64708a; --line:#dde5ef;
  --accent:#3e8fd0;
  --q1:#4a9be0; --q1s:#e3f0fc;   /* lernen - himmelblau */
  --q2:#2fa98a; --q2s:#dff4ee;   /* spielen - minze */
  --q3:#d99a1c; --q3s:#fcf1d8;   /* erwarten - sonnengelb */
  --q4:#e0667a; --q4s:#fce5e9;   /* braucht - rosa */
  --q6:#d9733a; --q6s:#fce8dc;   /* gewohnheiten - apricot */
  --q5:#8a73d6; --q5s:#ece8fa;   /* umgang - flieder */
  --storm:#6a6fb3; --storms:#e6e6f6; --sun:#e0a019; --suns:#fdf0d2; --calm:#4a9be0; --calms:#e3f0fc;
  --alert:#c4473a; --alerts:#fbe6e2;
  --sky1:#cfe6fb; --sky2:#f6fbff; --cloud:#ffffff;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a26; --surface:#1d2535; --ink:#e7ecf5; --muted:#a2adc4; --line:#2e3a50; --accent:#7ab8ef;
  --q1:#7ab8ef; --q1s:#1f3149; --q2:#5fd0b2; --q2s:#173832; --q3:#f0bf55; --q3s:#3a3017; --q4:#f2909f; --q4s:#3e2229; --q5:#b4a3f0; --q5s:#2c2747; --q6:#f4a77a; --q6s:#3d281c;
  --storm:#a9adf0; --storms:#2a2c4c; --sun:#f0bf55; --suns:#3a3017; --calm:#7ab8ef; --calms:#1f3149;
  --alert:#f2907f; --alerts:#3f2420; --sky1:#22314c; --sky2:#1a2333; --cloud:#2c3a55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a26; --surface:#1d2535; --ink:#e7ecf5; --muted:#a2adc4; --line:#2e3a50; --accent:#7ab8ef;
  --q1:#7ab8ef; --q1s:#1f3149; --q2:#5fd0b2; --q2s:#173832; --q3:#f0bf55; --q3s:#3a3017; --q4:#f2909f; --q4s:#3e2229; --q5:#b4a3f0; --q5s:#2c2747; --q6:#f4a77a; --q6s:#3d281c;
  --storm:#a9adf0; --storms:#2a2c4c; --sun:#f0bf55; --suns:#3a3017; --calm:#7ab8ef; --calms:#1f3149;
  --alert:#f2907f; --alerts:#3f2420; --sky1:#22314c; --sky2:#1a2333; --cloud:#2c3a55; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Himmel */
.sky{position:relative;margin-top:0;border-radius:28px;padding:22px 20px 20px;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.sky.storm{--sky1:var(--storms)} .sky.sun{--sky1:var(--suns)}
.sky .art{position:absolute;right:-6px;top:-4px;width:150px;height:110px;opacity:.95;pointer-events:none}
.sky .eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sky h1{font-size:clamp(1.9rem,7vw,2.6rem);margin-top:4px;max-width:78%}
.sky .band{color:var(--muted);font-weight:600;margin-top:2px;max-width:75%}
.nav-row{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.round{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:0 1px 0 var(--line)}
.round:disabled{opacity:.4;cursor:default}
.round svg{width:20px;height:20px}
.today-btn{border:0;border-radius:999px;background:var(--surface);padding:9px 16px;font-weight:800;box-shadow:0 1px 0 var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:.9rem;font-weight:800;background:var(--surface)}
.chip svg{width:18px;height:18px}
.chip.storm{color:var(--storm)} .chip.sun{color:var(--sun)} .chip.calm{color:var(--calm)}

/* Wochenleiste */
.strip-box{margin-top:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.strip{display:flex;gap:5px;width:max-content;align-items:flex-end}
.wk{position:relative;width:42px;flex:none;border:0;background:var(--surface);border-radius:14px;padding:8px 0 5px;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 1px 0 var(--line)}
.wk .n{font-size:.82rem;font-weight:800;color:var(--muted)}
.wk svg{width:18px;height:18px;display:block;margin:2px auto 0}
.wk.storm{background:var(--storms);color:var(--storm)} .wk.sun{background:var(--suns);color:var(--sun)} .wk.calm{color:var(--calm)}
.wk.today::after{content:"";position:absolute;left:12px;right:12px;bottom:-6px;height:4px;border-radius:4px;background:var(--q4)}
.wk[aria-current="true"]{outline:3px solid var(--ink);outline-offset:-3px}
.wk .m{position:absolute;top:-17px;left:0;font-size:.68rem;font-weight:800;color:var(--muted);white-space:nowrap}
.strip.hasm{padding-top:16px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend svg{width:16px;height:16px}

/* Auf einen Blick */
.glance{margin-top:18px;background:var(--surface);border-radius:22px;padding:16px 18px;display:grid;gap:10px;border:1px solid var(--line)}
.glance h2{font-size:1.15rem}
.glance .g{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.glance .g svg{width:26px;height:26px}
.glance .g b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.event{border-radius:16px;padding:10px 14px;background:var(--alerts)}
.event b{color:var(--alert)}

/* Sprungmarken */
.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:18px -16px 0;padding:8px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.jump button{flex:none;border:0;border-radius:999px;padding:6px 12px 6px 8px;font-weight:800;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.jump svg{width:18px;height:18px}

/* Fragekarten */
.q{margin-top:16px;border-radius:24px;background:var(--surface);border:1px solid var(--line);overflow:hidden;scroll-margin-top:64px}
.q header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--qs)}
.q header .badge{width:42px;height:42px;border-radius:14px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--qc)}
.q header .badge svg{width:24px;height:24px}
.q h2{font-size:1.25rem;color:var(--ink)}
.q ul{list-style:none;margin:0;padding:6px 8px 10px}
.q li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:start;padding:10px 8px;border-bottom:1px dashed var(--line)}
.q li:last-child{border-bottom:0}
.q li .dot{width:10px;height:10px;border-radius:50%;background:var(--qc);margin-top:8px}
.q li.leap .dot{background:var(--storm);border-radius:3px;transform:rotate(45deg)}
.q li .t{min-width:0}
.q li .how{display:block;margin-top:4px;font-size:.9rem;line-height:1.45;color:var(--muted)}
.q li .how b{color:var(--qc);font-weight:800}
.q li .tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--storm);margin-right:6px}
.info{width:34px;height:34px;border-radius:50%;border:2px solid var(--qs);background:var(--surface);color:var(--qc);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1rem}
.info:hover{background:var(--qs)}
.q1{--qc:var(--q1);--qs:var(--q1s)} .q2{--qc:var(--q2);--qs:var(--q2s)} .q3{--qc:var(--q3);--qs:var(--q3s)} .q4{--qc:var(--q4);--qs:var(--q4s)} .q5{--qc:var(--q5);--qs:var(--q5s)} .q6{--qc:var(--q6);--qs:var(--q6s)}
.jump .q1,.jump .q2,.jump .q3,.jump .q4,.jump .q5,.jump .q6{background:var(--qs);color:var(--ink)}
.jump button svg{color:var(--qc)}
.src{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:4px;vertical-align:1px}
.src i{font-style:normal;font-size:.68rem;font-weight:800;color:var(--muted);background:var(--bg);border-radius:6px;padding:0 5px}

/* Notiz */
.notebox{margin-top:16px;border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:16px}
.notebox h2{font-size:1.15rem;margin-bottom:8px}
textarea,input{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
.small{font-size:.85rem;color:var(--muted)}
.note{font-size:.88rem;color:var(--muted);margin-top:20px}

/* Seiten */
.page-head{margin-top:16px}
.page-head h1{font-size:clamp(1.7rem,6vw,2.3rem)}
.page-head p{color:var(--muted);margin:6px 0 0}
.stack{display:grid;gap:12px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;min-width:0}
.card h3{font-size:1.15rem;margin-bottom:6px}
.card ul{margin:6px 0 0;padding-left:20px}
.card.red{background:var(--alerts);border-color:transparent}
.card.red h3{color:var(--alert)}
.leapcard{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.leapnum{width:52px;height:52px;border-radius:18px;background:var(--storms);color:var(--storm);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.4rem}
.leapcard.now .leapnum{background:var(--storm);color:var(--surface)}
.leapcard .when{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:800;padding:0;margin-top:4px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{display:grid;gap:4px;font-weight:800;font-size:.9rem}
.btn{border:0;background:var(--accent);color:var(--surface);border-radius:999px;padding:10px 18px;font-weight:800}
.btn.btn2{background:var(--q1s);color:var(--ink)}
.version{text-align:center}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* Unten-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabbar button{border:0;background:none;border-radius:16px;padding:6px 4px;display:grid;justify-items:center;gap:2px;font-size:.78rem;font-weight:800;color:var(--muted)}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--ink);background:var(--q1s)}
.tabbar button.sos[aria-current="page"]{background:var(--alerts);color:var(--alert)}

/* Info-Blatt */
dialog{border:0;padding:0;border-radius:26px 26px 0 0;width:100%;max-width:640px;max-height:86vh;margin:auto auto 0;background:var(--surface);color:var(--ink)}
@media (min-width:700px){dialog{border-radius:26px;margin:auto}}
dialog::backdrop{background:rgba(20,26,38,.45)}
.sheet{padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:86vh}
.grip{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sheet .kicker{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--qc,var(--muted))}
.sheet h2{font-size:1.5rem;margin:4px 0 8px}
.sheet .ctx{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:.95rem;margin-bottom:12px}
.sheet .lead{font-size:1.02rem}
.sheet ul{padding-left:20px;margin:10px 0 0;display:grid;gap:8px}
.sheet .srclist{margin-top:16px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.close{position:sticky;top:0;float:right;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);font-size:1.3rem;line-height:1}
@media (prefers-reduced-motion:no-preference){.q,.glance{animation:rise .3s ease-out both}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
</style>
</head>

<script>

   QUELLEN - alle aus dem Repo „elternsein“

const SRC = {

  allg:{k:"allg.",t:"Allgemeines Wissen, nicht aus den Repo-Quellen - mit Kinderarzt oder Hebamme prüfen",f:"-"}
};

/* =========================================================
   THEMEN - Inhalt der Info-Blätter (ⓘ)
   Jeder Punkt: "Text|quellen"
   ========================================================= */
const TOPICS = {
 sprung:{t:"Was sind Sprünge?",lead:"Mentale Entwicklungsschritte, vor denen Babys für einige Tage oder Wochen anhänglicher, weinerlicher und unruhiger werden.",pts:[
  "Zehn Sprünge in den ersten 20 Monaten, gerechnet ab dem errechneten Termin, nicht ab der Geburt|oje",

 naehe:{t:"Nähe und Trösten",lead:"Babys kommen als „physiologische Frühgeburten“ und sind für ständigen Körperkontakt gebaut.",pts:[

 tragen:{t:"Tragen",lead:"Menschenbabys sind „Traglinge“: Sie klammern, nehmen von selbst die Anhock-Spreiz-Haltung ein und beruhigen sich am Körper.",pts:[

 stillstart:{t:"Stillstart",lead:"Stillen will gelernt sein. Fast alle haben in den ersten Wochen Schwierigkeiten - das ist normal.",pts:[
  "Nach der Geburt Haut an Haut: Zwischen die Brüste gelegt finden die meisten Babys die Brust selbst|agb",
  "In den ersten Tagen mindestens alle 3 Stunden anlegen, notfalls sanft wecken; danach nach Bedarf|agb,kd",
  "„Mund voll Brust“: Baby zur Brust, nicht Brust zum Baby; Bauch an Bauch; Positionen wechseln|agb",
  "Milcheinschuss nach 2-4 Tagen, vorher reicht das Kolostrum|agb",
  "Genug Milch, wenn es 6-8 nasse Windeln am Tag hat, zunimmt und rosig ist|agb,kd",
  "Stillberaterin schon vor der Geburt notieren - Hebammen sind nicht automatisch ausgebildete Stillberaterinnen|agb,kd",
  "Wiegen höchstens einmal pro Woche; Wiegepanik ist ein Hauptgrund für Stress und weniger Milch|agb",
  "Gestillte Babys brauchen weder Wasser noch Tee. Wer nicht stillen kann oder will: kein schlechtes Gewissen, Nähe geht auch mit Flasche|kd"]},
 hunger:{t:"Hungerzeichen",lead:"Weinen ist ein spätes Hungerzeichen. Wer früher reagiert, hat ein ruhigeres Baby.",pts:[
  "Stufe 1: sucht, schmatzt, öffnet den Mund, dreht den Kopf, klopft im Tuch an - sofort anlegen|agb",
  "Stufe 2: zappelt, streckt sich, Hand zum Mund - spätestens jetzt|agb",
  "Stufe 3: schreit, wird rot - erst beruhigen, dann trinken|agb",
  "„Wenn das Baby erst mal weint, haben wir schon die ersten zwei Stufen verpasst.“|agb",
  "Nach Bedarf füttern, nicht nach festem 3-Stunden-Takt - auch mit Flasche|agk,kd"]},
 cluster:{t:"Clusterfeeding und Dauerstillen",lead:"Abends oder in Wachstumsphasen will das Baby fast ununterbrochen trinken.",pts:[
  "Clusterfeeding ist normal und kein Zeichen für zu wenig Milch; Zufüttern ist im ersten Jahr meist nicht nötig|agb,kd",
  "Mama mit Snacks und Getränk versorgen; danach übernimmt Papa das Baby, damit sie schläft|kd,sheet",
  "In Sprungphasen wollen Babys die Brust oft zum Trösten, trinken aber wenig - weiterstillen|oje",
  "Stillgruppen bekommen auffällig viele Anfragen um die 3. und 6. Woche und den 3. und 6. Monat|oje",
  "Hält es länger an: Stillberaterin fragen|agb"]},
 stillprobleme:{t:"Schnelle Hilfe bei Stillproblemen",lead:"Ziehen am Anfang ist normal, Schmerz an der Brustwarze nicht.",pts:[
  "Wunde Brustwarzen: Anlegen prüfen lassen, Muttermilch einreiben und trocknen lassen, Luft, häufig anlegen|agb",
  "Milchstau (Knoten, rote Stelle): Bettruhe, vorher Wärme, danach kühlen, ausstreichen, weiterstillen|agb",
  "Plus Fieber über 38,4 °C = Brustentzündung: weiterstillen, Hebamme anrufen, Arzt bei Fieber über 24 Stunden|agb",
  "Zu wenig Milch: häufiger anlegen, nachts stillen, Schnuller und Flasche weglassen, Ruhe, essen, trinken|agb",
  "Hilfe: Stillberaterin (z. B. AFS, La Leche Liga)|agb,kd"]},
 papa:{t:"Die Rolle des Vaters",lead:"Väter sind von Anfang an eigenständige Bezugspersonen - nicht nur Unterstützung der Mutter.",pts:[
  "Bei der Geburt: Schnittstelle nach außen - Unterlagen, Personal, Licht, freundlich Nein sagen; tun, was sie jetzt braucht|agb",
  "Beim Kaiserschnitt nimmt der Vater das Baby nackt auf die Brust|agb",
  "Beim Stillen: Getränk und Essen bringen, Telefon und Klingel, Bäuerchen, Wickeln, Rückendeckung gegen Kommentare|agb,sheet",
  "Eine feste tägliche Aufgabe allein mit dem Baby (z. B. erste Wickelrunde, Abendspaziergang)|sheet",
  "Das schreiende Baby nicht reflexhaft abgeben, sondern „umschnallen“ - so wächst die Routine|emp,agb",
  "Mama lässt Papa eigene Wege finden; anders ist nicht schlechter|agb",
  "Positionscheck nach einigen Monaten: Ist Mama noch viel näher dran? Dann gemeinsam hinschauen|emp",
  "Väter brauchen andere Väter zum ehrlichen Austausch; Wochenbettdepression kann auch Väter treffen|agb,kd"]},
 schlafsicher:{t:"Sicherer Schlaf",lead:"Die wichtigsten Regeln für das erste Jahr - bei euch mit Beistellbett.",pts:[
  "Immer Rückenlage im Schlafsack; wach darf es auf den Bauch|kd",
  "Kein Kissen, keine Decke, kein Nestchen, keine Kuscheltiere im Babybett|kd",
  "Eigenes Bett im Elternschlafzimmer; das Beistellbett lückenlos und auf gleicher Höhe befestigen|kd,sheet",
  "Am sichersten ist laut Kinderarzt Prof. Jorch das eigene Bett im Elternschlafzimmer - genau eure Lösung|agb",
  "16-18 °C, Wärme im Nacken prüfen, keine Mütze im Bett, rauchfrei|kd,agb",
  "Niemals mit dem Baby auf dem Sofa einschlafen; nie im Elternbett nach Alkohol, Medikamenten oder bei extremer Erschöpfung|agb,sheet",
  "Keine ätherischen Öle im Babyzimmer|kd"]},
 einschlafen:{t:"Wege in den Schlaf",lead:"Einschlafbegleitung ist kein Fehler, sondern altersgemäß.",pts:[
  "Wege: Ruhe, „Langeweile“ (Flur auf und ab), Bewegung, raus, loslassen, selbst runterfahren|agb",
  "Timing: müde, aber nicht übermüdet - Augen reiben, gähnen, leerer Blick, Wegdrehen|agb,kd",
  "Tragen, Wiegen, Stillen in den Schlaf ist in den ersten Wochen normal|sheet,agb",
  "Die ins Bett bringende Person reguliert zuerst sich selbst - entspannt fast bis zum Einschlafen|fam",
  "Der Tag stellt die Nacht ein: Tageslicht, Bewegung draußen, ruhiger Nachmittag und Abend|agb,fam",
  "Kurze Rituale (Bad oder Massage, Lied, Segen) geben Halt|kd,sheet,hab",
  "Bei Kleinkindern sind 30-90 Minuten Einschlafbegleitung weltweit normal|fam"]},
 ablegen:{t:"Schlafendes Baby ablegen",lead:"Viele Babys wachen beim Ablegen auf - mit Geduld klappt es öfter.",pts:[
  "Bis zum Tiefschlaf warten (bis zu 20 Minuten)|agb",
  "Test: Ärmchen etwa 5 cm anheben und loslassen - fällt es schlaff wie bei einer Puppe, ist es so weit|agb",
  "Nicht auf den Rücken plumpsen lassen, sondern in einer Spirale ablegen: Füße, Beine, Po, Seite, Rücken|agb",
  "Druck und Wärme erst langsam lösen: Hand liegen lassen, im Tuch ablegen|agb",
  "Ein Neugeborenes lebt in den ersten Wochen oft an oder auf jemandem - das darf so sein|agb"]},
 schlaftraining:{t:"Warum kein Schlaftraining",lead:"Alle Quellen im Repo raten davon ab.",pts:[
  "„Babys lernen nicht - sie geben auf.“ Stresshormone bleiben hoch|kd",
  "In einer Studie weinten Babys nach drei Tagen Schlaftraining nicht mehr, ihr Cortisol blieb aber erhöht|fam",
  "Wer so überfordert ist, dass er das Baby schütteln möchte, braucht Unterstützung, kein Training|agb",
  "Durchschlafen heißt in der Forschung 5 Stunden - und ist in den ersten Jahren die Ausnahme|agb,kd",
  "Wer es schon gemacht hat: ab jetzt wieder ko-regulieren; Eltern dürfen ihre Meinung ändern|fam"]},
 schreien:{t:"Schreiabende",lead:"Viele Babys weinen abends viel - meist wegen Reifung und Reizverarbeitung, nicht wegen „Koliken“.",pts:[
  "Schreien nimmt oft bis Woche 6-8 zu; der Gipfel um Woche 10-14 hängt mit der Gehirnentwicklung zusammen|agb,fam",
  "Weinen begleiten statt abstellen: im Arm, Herzschlag, ruhig atmen|fam,sheet",
  "Treppensteigen mit dem Baby im Tuch vertieft euren Atem und baut Stress ab|fam",
  "Reize runter, Körperkontakt rauf; manche Babys beruhigt wildes Tanzen eng im Tuch, danach langsamer|agb,sheet",
  "Schreibaby-Faustregel: mehr als 3 Std. am Tag, an mehr als 3 Tagen pro Woche, über 3 Wochen - euer Leidensdruck zählt mehr als die Regel|kd,agb",
  "Hilfe: Schreiambulanz (für Kinder bis 3 Jahre), Hebamme, Kinderarzt|kd,agb,emp"]},
 ueberforderung:{t:"Wenn ihr nicht mehr könnt",lead:"Überforderung ist echt und kein Versagen. Wichtig ist, was ihr dann tut.",pts:[
  "Baby sicher ins Bett legen, Raum verlassen, durchatmen, Partner, Freundin oder Hebamme anrufen|sheet",
  "Niemals schütteln - Hirnblutungen und Lebensgefahr|oje,sheet",
  "Aggressive Gefühle sind nicht unnormal, handeln darf man nicht danach - dann Beratungsstelle anrufen|oje",
  "Seid ihr nur sauer, bleibt beim Kind und kommt vor Ort runter; seid ihr überfordert, geht kurz raus - Sicherheit geht vor|fam",
  "Notfall-Tipps: Lautstärke runter, am offenen Fenster atmen, ankündigen „Ich brauche kurz Zeit“, danach entschuldigen|kd",
  "„Bedürfnisorientiert plus wenig Unterstützung ist ein Ticket in den Burn-out“ - deshalb Hilfe von Anfang an|agb"]},
 wochenbett:{t:"Wochenbett",lead:"Die ersten Wochen gehören der Erholung und dem Kennenlernen.",pts:[
  "Ihr bestimmt, wer zu Besuch kommt und wann ihr das Baby bei euch habt|kd,oje",
  "Besuch bringt Essen mit oder hängt Wäsche auf - nicht umgekehrt|agk,kd",
  "Nachwehen beim Stillen, Wochenfluss und ein geschwächter Beckenboden sind normal|agb",
  "Schlafen, wenn das Baby schläft; der Haushalt wartet|sheet,agb",
  "Babyblues ist häufig. Traurigkeit, Leere oder Schuldgefühle über Wochen: Hebamme ansprechen - auch Väter können erkranken|agb,kd"]},
 paar:{t:"Für euch als Paar",lead:"Die Paarbeziehung trägt die Familie - sie braucht feste Zeiten.",pts:[
  "Seglertrick: im Alltag nur auf etwa 80 % fahren, damit für Zahnen, Schübe und Infekte Reserve bleibt|agb",
  "„Hinsetzen muss getan werden“ - fünf Minuten sitzen, auch wenn noch viel zu tun ist|agb",
  "Paarzeit fest in den Kalender, ein Spaziergang reicht - als Paar reden, nicht über Babythemen|emp,agb",
  "Ein freier Abend pro Woche für jeden|emp,kd",
  "Nacht in Zuständigkeiten teilen und den Schlafmangel des anderen anerkennen|agb",
  "Pufferzone beim Heimkommen: Runde um den Block, dann „müdes Abendkind“ statt Feierabend|fam",
  "Hilfe von Anfang an annehmen - das Dorf baut sich nicht von allein|agb,slow"]},
 bonding:{t:"Geburt und Bonding",lead:"Die erste Stunde ist besonders - und Bindung lässt sich auch später noch stärken.",pts:[
  "Erste Stunde: nicht wiegen oder waschen, U1 auf Mamas Bauch, Haut an Haut|agb",
  "Wünsche vorher mit Klinik und Hebamme klären (Bonding, Nabelschnur, Vitamin K)|agb",
  "Bei Kaiserschnitt: Baby ungewaschen auf die nackte Brust, zusammenbleiben|agb",
  "Bindung ist ein Prozess, kein Einzelereignis - nach schwerem Start helfen viel Kuscheln, prompte Reaktion und Zeit|fam,kd",
  "Starthilfe: Bonding-Bad - Baby nass und warm auf Mamas Bauch, auch zu Hause|agb"]},
 sinne:{t:"Was Neugeborene wahrnehmen",lead:"Neugeborene können mehr, als man denkt.",pts:[
  "Sehen scharf auf etwa 20 cm - genau der Abstand beim Stillen|oje",
  "Lieben Gesichter, starke Kontraste, Streifen und Rot|oje",
  "Erkennen eure Stimmen gleich nach der Geburt, mögen hohe Stimmen; plötzlicher Lärm ist unangenehm|oje",
  "Erkennen Mamas Geruch, auch an einem getragenen Kleidungsstück|oje",
  "Ahmen Gesichtsbewegungen nach, wenn man ihnen Zeit lässt|oje",
  "Reflexe (Greifen, Saugen, Moro-Reflex) verschwinden in den ersten Monaten|oje"]},
 sprache:{t:"Sprache von Anfang an",lead:"Bei der Sprache gilt nicht „jedes Kind hat sein Tempo“ - früh viel reden und Auffälligkeiten ernst nehmen.",pts:[
  "Von Anfang an mit dem Baby sprechen und den Alltag begleiten („Jetzt ziehen wir die Jacke an“)|kd",
  "Laute nachahmen, Pausen lassen - ein Gespräch abwechselnd|oje,kd",
  "Bücher gemeinsam anschauen, Reime und Lieder; Fernseher und Hörspiele ersetzen das nicht|kd",
  "Richtig wiederholen statt korrigieren („Ja, du hast die Püppi geholt!“)|kd,oje",
  "Erste Wörter um den ersten Geburtstag, mit 2 Jahren etwa 50 Wörter|kd",
  "Mehrsprachigkeit ist ein Geschenk, kein Risiko|kd"]},
 bauchlage:{t:"Bewegung und Bauchlage",lead:"Freie Bewegung auf dem Boden fördert die Entwicklung am besten.",pts:[
  "Wache Bauchlage von Anfang an: erst 20-30 Sekunden, ab 3 Monaten mehrere Minuten, gern auf eurer Brust|kd",
  "Beugt einem flachen Hinterkopf vor; Babyschale nur zum Transport|kd",
  "Viel Bodenzeit auf einer Decke statt Wippe|kd",
  "Nicht hinsetzen, bevor es selbst sitzt; nicht an den Armen hochziehen (das „Hochziehspiel“ aus Oje übernehmen wir nicht)|kd,oje",
  "Nackt strampeln lässt es seinen Körper besser kennenlernen|oje"]},
 spielen:{t:"Spielen mit Babys",lead:"Babys brauchen kein Programm - ihr seid das spannendste Spielzeug.",pts:[
  "Gesicht, Stimme, Lieder, Grimassen - mehr braucht es anfangs nicht|oje,tw",
  "Schaut das Baby weg oder dreht den Körper weg, will es Pause|oje",
  "Geplante Spielstunden passen nicht: „Ein Baby ist kein Video, das man einschalten kann.“|oje",
  "Alltagsgegenstände und echte Dinge statt viel Spielzeug|fam,oje",
  "Draußen sein: Gras, Sand, Blätter, Himmel|slow,agb",
  "Es ist nicht eure Aufgabe, ständig zu bespielen - beschützen, trösten, ernähren steht vorn|fam"]},
 beikost:{t:"Beikost",lead:"Beikost ist eine Beigabe, kein Ersatz - Milch bleibt lange Hauptnahrung.",pts:[
  "Start frühestens Beginn 5., spätestens Beginn 7. Monat; entscheidend ist das Kind|kd",
  "Reifezeichen: hält den Kopf, steckt gezielt Dinge in den Mund, Zungenstoßreflex ist weg|kd",
  "Klassisch: Gemüsebrei mittags, ab etwa 6 Monaten mit Fleisch (Eisen), dann Milch-Getreide- und Obst-Getreide-Brei|kd",
  "Gläschen sind okay; kein Salz, kein Zucker, kein Honig im ersten Jahr|kd",
  "Hochstuhl erst, wenn es sicher sitzt; mit Fußstütze, nie allein|kd",
  "Weiches Fingerfood ist möglich; kein Zwang beim Essen|kd,oje"]},
 allergene:{t:"Allergien vorbeugen",lead:"Vermeiden beugt nicht vor - Vielfalt schon.",pts:[
  "Allergene Lebensmittel früh und regelmäßig anbieten (mindestens einmal pro Woche)|kd",
  "Gluten im Zeitfenster 5.-7. Monat einführen|kd",
  "HA-Nahrung ohne Allergierisiko nicht nötig|kd",
  "Beste Vorbeugung ist Stillen|kd"]},
 zaehne:{t:"Zähne",lead:"Zahnen und Sprünge fallen nicht unbedingt zusammen.",pts:[
  "Erster Zahn meist um 6 Monate, bis 2,5 Jahre alle 20 Milchzähne|oje,kd",
  "Fieber oder Durchfall kommen nicht vom Zahnen - dann ist das Baby krank|oje,kd",
  "Linderung: kühler Beißring, Zahnfleischmassage|kd,agb",
  "Ab dem ersten Zahn zweimal täglich putzen, Eltern putzen bis ins Grundschulalter nach|kd",
  "Schnuller und Löffel nicht ablecken; keine gesüßten Getränke|kd",
  "Fluorid und Vitamin D: Variante mit dem Kinderarzt klären|kd"]},
 verdauung:{t:"Windeln und Verdauung",lead:"Was in der Windel normal ist - und was nicht.",pts:[
  "Kindspech in den ersten 48 Stunden; danach anfangs etwa 3 Stuhlwindeln am Tag|kd",
  "Vollgestillte bis 3 Monate: bis zu 14 Tage ohne Stuhl normal, solange es gedeiht|kd",
  "Pressen und Rotwerden ist normal - Babys müssen Kacken lernen; Beinchen anwinkeln, Bauch im Uhrzeigersinn massieren|kd",
  "Sehr heller, entfärbter Stuhl: sofort zum Kinderarzt (Stuhlfarbkarte im U-Heft)|kd",
  "Kein Fencheltee oder Wasser für Neugeborene|kd"]},
 kindersicher:{t:"Ja-Umgebung",lead:"Probleme organisatorisch lösen statt mit Dauer-Nein.",pts:[
  "Steckdosen, Kabel, Treppen, Fenster sichern, Möbel kippsicher|fam,kd",
  "Kleinteile weg (auch In-Ear-Kopfhörer am Boden), keine Tischdecken|fam,kd",
  "Putzmittel, Medikamente, giftige Pflanzen hoch oder weggeschlossen|fam,kd",
  "Nie allein auf Wickeltisch, Bett oder Sofa lassen|kd",
  "Eine Schublade mit Ungefährlichem zum Ausräumen (Tupperware, Kochlöffel, Schneebesen)|fam",
  "„Stopp“ statt „Nein“|fam"]},
 fremdeln:{t:"Fremdeln",lead:"Ein wichtiger Entwicklungsschritt, kein Erziehungsthema.",pts:[
  "Meist um 8-10 Monate, endet zwischen 18 Monaten und 3 Jahren|kd,fam",
  "Oft stärker gegenüber Männern; schwächer, wenn das Kind viele Bezugspersonen hat|fam",
  "Angst ernst nehmen, nicht „Ist doch alles gut“|fam,kd",
  "Verwandte nähern sich sanft, langsam, leise; Kind bleibt auf eurem Arm|fam",
  "Großeltern erklären: hat nichts mit ihnen persönlich zu tun|fam"]},
 trennung:{t:"Trennungsangst",lead:"Mit etwa einem halben Jahr versteht das Baby, dass ihr weggehen könnt.",pts:[
  "Am stärksten klammern viele um Woche 29|oje",
  "Ankündigen, bevor ihr den Raum verlasst; beim Zimmerwechsel weitersprechen|oje",
  "Hinterherkrabbeln lassen - das Baby bestimmt den Abstand selbst|oje",
  "Kuckuck- und Versteckspiele üben das Wiederkommen|oje",
  "Wichtig für jede Eingewöhnung: lange, mit Bezugsperson in Reichweite|fam,agb"]},
 umfeld:{t:"Kommentare aus Familie und Umfeld",lead:"Ihr müsst euren Weg nicht verteidigen.",pts:[
  "Weiteratmen; „Wer fragt, der führt“: „Welche Sorge hast du? Wie war das bei dir?“|fam",
  "Danken und freundlich bleiben: „Ich nehm das mal mit.“ - „Für uns passt das nicht.“|fam",
  "Ohne Begründung - Begründungen wirken wie Angriff|fam",
  "Großeltern: Wer aufpasst, entscheidet über kleine Dinge (z. B. Eis)|emp",
  "Erst als Paar klären, dann Rat holen|emp"]},
 grenzen:{t:"Grenzen mit Herz",lead:"Klar und freundlich, ohne Strafen.",pts:[
  "Ja-Grenze: „Ich sehe, du willst das. Ich verstehe dich. Heute geht es nicht.“ - im Moment nicht erklären|fam",
  "Konkret, einzeln, respektvoll - und ohne „sonst bin ich traurig“|emp,fam",
  "Was das Kind zum ersten Mal versteht, darf man erwarten - nicht mehr und nicht weniger|oje",
  "Beständig statt „konsequent“, logische Folgen statt Strafen|kd",
  "Teilen nicht erzwingen - unter 3 Jahren gelingt es kaum|emp,fam",
  "Spielerisch statt Machtkampf: beim Anziehen doof anstellen, aussuchen lassen|fam,eos"]},
 wut:{t:"Wut und Wutanfälle",lead:"Das junge Gehirn lernt Beruhigung nur durch viele ruhige Begleitungen.",pts:[
  "Beim Kind bleiben, Gefühl benennen, ruhig halten - Trampelpfade werden zu Alleen|fam,kd",
  "Keine Auszeiten als Strafe, kein Liebesentzug|kd,eos",
  "Wen zuerst trösten? Das Kind, das am meisten Beruhigung braucht|fam",
  "Aggressionshöhepunkt erst mit etwa 4 Jahren|fam",
  "Eigene Regulation zuerst - Co-Regulation statt Eskalation|inb,eos"]},
 laufen:{t:"Laufen lernen",lead:"Jedes Kind läuft, wenn es so weit ist.",pts:[
  "Bis 16 Monate laufen etwa 90 %|kd",
  "Kein Lauflernhelm, kein Gehfrei - gefährlich und hemmend|kd",
  "Nicht an den Händen „laufen üben“, lieber Anreize schaffen|kd,oje",
  "Barfuß oder Antirutschsocken; Schuhe erst, wenn es sicher läuft|kd",
  "Läuft es mit 20 Monaten noch nicht frei: Kinderarzt|kd"]},
 bildschirm:{t:"Bildschirme",lead:"Kleine Kinder brauchen echte Menschen, keine Bildschirme.",pts:[
  "Möglichst keine Bildschirme in den ersten Jahren|kd,tw",
  "Handy weg beim Stillen, Essen und Spielen - ihr seid Vorbild|tw,emp",
  "Gerätefreie Stunde vor dem Schlafengehen, Ladeplatz außerhalb des Schlafzimmers|tw,sheet",
  "Kindersendungen, die Oje für 13-17 Monate empfiehlt, übernehmen wir nicht|tw,kd"]},
 arzt:{t:"Wann zum Arzt",lead:"Faustregel: lieber einmal zu viel.",pts:[
  "Baby unter 6 Monaten mit Fieber über 38 °C: sofort (außer kurz nach Impfung)|kd",
  "Trinkt nicht ausreichend, wenig nasse Windeln, Durchfall, mehr Erbrechen als sonst: Kinderarzt|kd",
  "Schrilles, nicht zu beruhigendes Weinen, angestrengte Atmung, Apathie: 112|kd",
  "Mitnehmen: Krankenkassenkarte, U-Heft, Impfpass|kd"]},
 uterm:{t:"U-Untersuchungen",lead:"Vorsorge beim Kinderarzt - Termine früh vereinbaren.",pts:[
  "U1 direkt nach der Geburt, U2 am 3.-10. Lebenstag (mit Neugeborenen- und Hörscreening)|kd,allg",
  "U3 etwa in der 4.-5. Lebenswoche|kd,allg",
  "U4 mit 3-4 Monaten, U5 mit 6-7 Monaten, U6 mit 10-12 Monaten, U7 mit etwa 2 Jahren|allg,kd",
  "Kinderarzt idealerweise schon vor der Geburt ausgesucht (habt ihr erledigt)|kd",
  "Impfungen beginnen meist ab etwa 2 Monaten - Plan mit dem Kinderarzt|allg"]},
 vitd:{t:"Vitamin D und Fluorid",lead:"Stand des KidsDoc-Buchs - mit Kinderarzt klären.",pts:[
  "Ab der ersten Lebenswoche täglich Vitamin D (500 IE) und Fluorid (0,25 mg) als Tablette bis zum ersten Zahn|kd",
  "Danach entweder fluoridhaltige Kinderzahnpasta plus Vitamin D oder fluoridfreie Pasta plus Kombitablette|kd"]},
 rituale:{t:"Kleine Rituale",lead:"Wiederkehrende Momente geben Halt - dem Baby und euch.",pts:[
  "Immer gleiches Begrüßungsritual nach dem Aufwachen: Blick, ruhige Stimme, Name|sheet",
  "Abendsegen mit der Hand auf Brust oder Kopf, jeden Abend gleich|sheet,hab,inb",
  "Schon in der Schwangerschaft und dann täglich segnen und gute Worte sprechen|emp",
  "Singen statt Musik vom Band; ein Morgen- und ein Schlaflied|tw,sheet",
  "Wöchentliches Foto am gleichen Ort plus ein Satz, was neu war|sheet"]},
 gewohnheiten:{t:"Gewohnheiten statt Vorsätze",lead:"„The heart follows the habit.“ Kinder prägt, was wir tun, nicht was wir erklären.",pts:[
  "Jede Familie hat schon Gewohnheiten - wer nicht bewusst wählt, übernimmt die der Umgebung (Bildschirme, Hetze)|hab",
  "Klein anfangen: eine Gewohnheit wählen, nicht alles auf einmal|hab,slow",

  games:["Kuckuck mit einem Tuch, Spiegelspiele|oje|spielen|Kuckuck: Tuch übers Gesicht des Babys legen und fragen „Wo ist …?“. Zieht es nicht selbst, seine Hand nehmen und das Tuch gemeinsam langsam runterziehen, ganz einfach halten. Spiegel: zusammen reinschauen, es pendelt zwischen euch und dem Spiegelbild und lacht, wenn das „echte“ Gesicht spricht.","Reime und Kitzelspiele: „Backe, backe Kuchen“|oje|sprache|„Backe, backe Kuchen“ und Lieder mit Bewegung im Takt, etwa Wiegen oder Tanzen. Kitzelspiel: „Da kommt die Maus …“, die Finger laufen über den Körper, zum Schluss am Ohrläppchen „klingeln“. Oder „Jetzt werd ich dein … (Pause) Näschen packen!“ und die Nase sanft schütteln.","Kurze, betonte Sätze: „Fühl mal, Gras.“|oje|sprache|Sprecht viel über das, was es gerade sieht, hört, schmeckt und fühlt. Kurze, einfache Sätze und das wichtige Wort betonen: „Fühl mal, Gras.“ „Papa kommt.“ „Horch, die Klingel.“"],

const DAY=864e5, MAXW=90;
const store={get(k,d){try{const v=localStorage.getItem("bwk."+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("bwk."+k,JSON.stringify(v))}catch(e){}}};
const VERSION="1.0";

/* Gemeinsamer Stand S: daten/et, daten/birth als {v,ts}; notizen/w<Woche> als {t,ts}.
   Jeder Eintrag trägt seinen Zeitstempel, beim Abgleich gewinnt pro Eintrag der jüngere.
   Leere Notizen bleiben als {t:"",ts} stehen statt gelöscht zu werden, so kommt das
   Leeren auch auf dem anderen Gerät an und es braucht keine Grabsteine. */
const S=store.get("S",null)||(()=>{
  // Erster Start dieser Fassung: alte Einzelschlüssel übernehmen. ts:1 = älter als jede echte Änderung.
  const s={daten:{},notizen:{}}, et=store.get("et",null), bi=store.get("birth",""), n=store.get("notes",{});
  if(et) s.daten.et={v:et,ts:1};
  if(bi) s.daten.birth={v:bi,ts:1};
  Object.keys(n).forEach(k=>{ if(String(n[k]).trim()) s.notizen["w"+k]={t:n[k],ts:1}; });
  store.set("S",s); return s;
})();
const wert=p=>{const [a,b]=p.split("/"); return S[a]&&S[a][b]};
const notiz=w=>(wert("notizen/w"+w)||{}).t||"";
const alleNotizen=()=>Object.entries(S.notizen||{}).map(([k,v])=>[+k.slice(1),(v&&v.t)||""]).filter(([k,t])=>t.trim());
const state={tab:"woche",et:(wert("daten/et")||{}).v||"2026-10-28",birth:(wert("daten/birth")||{}).v||"",week:null};

/* ---------- Sync über Firebase (REST, kein SDK) ----------
   Gleiches Vorgehen wie Brain und Küchenplan: haushalte/<code>/..., Regeln unverändert.
   Geschrieben wird immer nur der einzelne Eintrag, nie eine ganze Sammlung. */
const cfg=store.get("sync",{db:"",hid:""});
const queue=store.get("q",{});
const basis=()=>cfg.db&&cfg.hid?cfg.db.replace(/\/$/,"")+"/haushalte/"+cfg.hid:null;
let es=null, syncState="lokal", versuche=0, wiederTimer=null, flushTimer=null, sendet=false, renderWartet=false;
const SYNCTEXT={lokal:"nur auf diesem Gerät",verbindet:"verbindet …",live:"verbunden - Änderungen kommen sofort an",
  getrennt:"gerade keine Verbindung - Änderungen werden nachgeschickt",verweigert:"Firebase verweigert den Zugriff - Datenbank-URL und Code prüfen"};
const ts=v=>v&&typeof v==="object"?+v.ts||0:-1;

function lokalSetzen(p,v){const [a,b]=p.split("/"); S[a]=S[a]||{}; if(v===null) delete S[a][b]; else S[a][b]=v;}
function setzen(p,v){ lokalSetzen(p,v); store.set("S",S); queue[p]=v; store.set("q",queue); clearTimeout(flushTimer); flushTimer=setTimeout(flush,700); }
async function flush(){
  clearTimeout(flushTimer);
  if(!basis()||sendet||syncState==="verweigert") return;
  const keys=Object.keys(queue); if(!keys.length) return;
  sendet=true; let ok=true;
  for(const p of keys){
    const v=queue[p];
    try{
      const r=await fetch(basis()+"/"+p+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});
      if(r.ok){ if(queue[p]===v) delete queue[p]; }
      else { ok=false; if(r.status===401||r.status===403) zustand("verweigert"); break; }
    }catch(e){ ok=false; break; }
  }
  store.set("q",queue); sendet=false; statusZeigen();
  if(ok&&Object.keys(queue).length) flush();
}
/* Neuer Stand von außen: Ansicht nur neu zeichnen, wenn gerade niemand tippt */
function uebernehmen(){
  store.set("S",S);
  state.et=(wert("daten/et")||{}).v||state.et; state.birth=(wert("daten/birth")||{}).v||"";
  const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&document.getElementById("view").contains(a)){ renderWartet=true; return; }
  render();
}
document.addEventListener("focusout",()=>setTimeout(()=>{ const a=document.activeElement;
  if(renderWartet&&!(a&&/INPUT|TEXTAREA/.test(a.tagName))){ renderWartet=false; render(); } },0));

function zusammenfuehren(fern){
  fern=fern&&typeof fern==="object"?fern:{}; let neu=false;
  ["daten","notizen"].forEach(f=>{
    const l=S[f]||{}, r=(fern[f]&&typeof fern[f]==="object")?fern[f]:{};
    new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{
      const tl=ts(l[k]), tr=ts(r[k]);
      if(tr>tl){ lokalSetzen(f+"/"+k,r[k]); neu=true; }
      else if(tl>tr) queue[f+"/"+k]=l[k];   // kennt die Gegenseite noch nicht
    });
  });
  store.set("q",queue); flush();
  if(neu) uebernehmen();
}
function eintragRein(p,v){
  const t=p.split("/").filter(Boolean);
  if(t.length===2&&(t[0]==="daten"||t[0]==="notizen")){
    if(v===null){ if(wert(p)){ lokalSetzen(t.join("/"),null); return true; } return false; }
    if(ts(v)>ts(wert(t.join("/")))){ lokalSetzen(t.join("/"),v); return true; }
  }else if(t.length===1&&v&&typeof v==="object"){
    let neu=false; Object.entries(v).forEach(([k,x])=>{ if(eintragRein(t[0]+"/"+k,x)) neu=true; }); return neu;
  }
  return false;
}
function zustand(z){ syncState=z; statusZeigen(); }
function statusZeigen(){
  const el=document.getElementById("syncStatus"); if(!el) return;
  const n=Object.keys(queue).length;
  el.textContent=(basis()?SYNCTEXT[syncState]:SYNCTEXT.lokal)+(basis()&&n?` · ${n===1?"1 Änderung wartet":n+" Änderungen warten"}`:"");
}
function verbinden(){
  if(es){try{es.close();}catch(e){} es=null;}
  clearTimeout(wiederTimer);
  if(!basis()){ zustand("lokal"); return; }
  zustand("verbindet");
  try{
    es=new EventSource(basis()+".json");
    es.addEventListener("put",e=>{
      let d; try{ d=JSON.parse(e.data); }catch(err){ return; }
      if(!d||typeof d!=="object") return;
      if(d.path==="/"||d.path===""){ zusammenfuehren(d.data); return; }
      if(eintragRein(d.path,d.data)) uebernehmen();
    });
    es.addEventListener("patch",e=>{
      let d; try{ d=JSON.parse(e.data); }catch(err){ return; }
      if(!d||typeof d!=="object") return;
      let neu=false; Object.entries(d.data||{}).forEach(([k,v])=>{ if(eintragRein((d.path==="/"?"":d.path)+"/"+k,v)) neu=true; });
      if(neu) uebernehmen();
    });
    es.addEventListener("keep-alive",()=>{ if(syncState!=="live") zustand("live"); });
    // Abgelehnte Regeln meldet Firebase über eigene Ereignisse, nicht über einen Fehler
    const verweigert=()=>{ zustand("verweigert"); try{es.close();}catch(err){} es=null; };
    es.addEventListener("cancel",verweigert); es.addEventListener("auth_revoked",verweigert);
    es.onopen=()=>{ versuche=0; zustand("live"); flush(); };
    es.onerror=()=>{ if(syncState==="verweigert") return; zustand("getrennt"); neuVerbinden(); };
  }catch(e){ zustand("getrennt"); neuVerbinden(); }
}
function neuVerbinden(){
  clearTimeout(wiederTimer);
  if(syncState==="verweigert") return;
  if(es){try{es.close();}catch(e){} es=null;}
  wiederTimer=setTimeout(()=>{ if(basis()&&syncState!=="live") verbinden(); },Math.min(30000,1000*Math.pow(2,Math.min(versuche++,5))));
}
// Nach Ruhezustand oder Funkloch ist die Verbindung meist tot
function syncPruefen(){ if(!basis()||syncState==="verweigert") return; flush(); if(syncState!=="live"&&syncState!=="verbindet"){ versuche=0; verbinden(); } }
addEventListener("online",()=>{ versuche=0; syncPruefen(); });
addEventListener("offline",()=>{ if(syncState==="live") zustand("getrennt"); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") syncPruefen(); });
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const birthDate=()=>state.birth?parse(state.birth):parse(state.et);
const offsetWeeks=()=>(birthDate()-parse(state.et))/DAY/7;
const ageWeekNow=()=>Math.floor((today()-birthDate())/DAY/7);
const clampW=w=>Math.max(0,Math.min(MAXW,w));
const fmt=d=>d.toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"});
const fmtS=d=>d.toLocaleDateString("de-DE",{day:"numeric",month:"short"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function leapState(w){
  const e=w+0.5+offsetWeeks();
  for(const L of LEAPS) if(e>=L.from&&e<=L.to) return {kind:"storm",leap:L,next:L};
  let last=null; for(const L of LEAPS) if(e>L.to) last=L;
  const next=LEAPS.find(L=>L.from>e)||null;
  if(last&&e-last.to<=3) return {kind:"sun",leap:last,next};
  return {kind:"calm",leap:last,next};
}
const bandOf=w=>BANDS.find(b=>w>=b.from&&w<=b.to)||BANDS[BANDS.length-1];
const eventsOf=w=>EVENTS.filter(e=>w>=e.from&&w<=e.to);

  return `<li class="${isLeap?"leap":""}"><span class="dot"></span><span class="t">${isLeap?`<span class="tag">Sprung</span>`:""}${esc(it.text)}${tags(it.srcs)}${it.how?`<span class="how"><b>So geht's:</b> ${esc(it.how)}</span>`:""}</span>${it.topic?`<button class="info" data-item="${id}" aria-label="Mehr dazu: ${esc(it.text)}">i</button>`:"<span></span>"}</li>`;

function ageLabel(w){
  if(w<=0) return "Erste Lebenswoche";
  const m=Math.floor(w/4.345),r=Math.round(w-m*4.345);
  if(m<1) return `${w} ${w===1?"Woche":"Wochen"} alt`;
  return `${m} ${m===1?"Monat":"Monate"}${r>0?` und ${r} ${r===1?"Woche":"Wochen"}`:""}`;
}

   <div class="g" style="color:var(--q5)">${ICON.tip}<div style="color:var(--ink)"><b>Tipp der Woche</b>${esc(tip.text)}</div></div>

    return `<button class="wk ${k}${i===now?" today":""}" data-w="${i}" aria-current="${i===w}" aria-label="Woche ${i}">${lab}<span class="n">${i}</span>${ICON[k]}</button>`}).join("");

     ${basis()?`<button class="btn btn2" type="button" data-act="trennen">Trennen</button>`:""}</p>
    <p class="small" id="syncOk" aria-live="polite"></p>
    <p class="small">Erstes Handy: dieselbe Datenbank-URL wie in Brain eintragen, „Code erzeugen“, speichern. Zweites Handy: dieselbe URL und <b>denselben</b> Code eintragen, dort keinen neuen Code erzeugen. Was schon auf einem Gerät steht, wird beim Verbinden zusammengeführt, bei derselben Woche gewinnt die jüngere Fassung.</p>
    <p class="small">Wer den Code kennt, kommt an die Notizen - also nur unter euch weitergeben.</p></form>
   <div class="card"><h3>Alle Themen</h3>${topicsList}</div>
   <div class="card tbl"><h3>Quellen</h3><table><thead><tr><th>Kürzel</th><th>Quelle</th><th>Datei im Repo</th></tr></thead><tbody>${Object.values(SRC).map(s=>`<tr><td><b>${s.k}</b></td><td>${esc(s.t)}</td><td class="small">${esc(s.f)}</td></tr>`).join("")}</tbody></table></div>
  </div>
  <p class="small version">Babywochen-Kompass ${VERSION}</p>`;
}

/* =========================================================
   INFO-BLATT
   ========================================================= */
const dlg=document.getElementById("sheet"), body=document.getElementById("sheetBody");
function openTopic(key,ctx,q){
  const T=TOPICS[key]; if(!T) return;
  const used=new Set(); const pts=T.pts.map(p=>{const it=parseItem(p); it.srcs.forEach(s=>used.add(s)); return `<li>${esc(it.text)}${tags(it.srcs)}</li>`}).join("");
  body.style.setProperty("--qc", q?`var(--${q})`:"var(--muted)");
  body.innerHTML=`<button class="close" id="closeSheet" aria-label="Schließen">×</button><div class="grip"></div>
   <div class="kicker">${q?esc(QUESTIONS.find(x=>x.id===q).title):"Thema"}</div>
   <h2 id="sheetTitle">${esc(T.t)}</h2>
   ${ctx?`<div class="ctx">${esc(ctx)}</div>`:""}
   <p class="lead">${esc(T.lead)}</p><ul>${pts}</ul>
   <div class="srclist"><b>Quellen:</b> ${[...used].map(k=>esc(SRC[k].t)).join(" · ")}</div>`;
  if(typeof dlg.showModal==="function") dlg.showModal(); else dlg.setAttribute("open","");
  body.scrollTop=0;
}
dlg.addEventListener("click",e=>{ if(e.target===dlg||e.target.id==="closeSheet") dlg.close(); });

/* =========================================================
   STEUERUNG
   ========================================================= */
function render(){
  document.querySelectorAll(".tabbar button").forEach(b=>b.removeAttribute("aria-current"));
  const active=document.querySelector(`.tabbar button[data-tab="${state.tab}"]`); if(active) active.setAttribute("aria-current","page");
  const v=document.getElementById("view");
  v.innerHTML=({woche:viewWoche,spruenge:viewSpruenge,notfall:viewNotfall,mehr:viewMehr})[state.tab]();
  if(state.tab==="woche"){
    const cur=v.querySelector('.wk[aria-current="true"]'),box=document.getElementById("strip");
    if(cur&&box) box.scrollLeft=cur.offsetLeft-box.clientWidth/2+cur.clientWidth/2;
    const t=document.getElementById("note");
    t.addEventListener("input",()=>{ setzen("notizen/w"+state.week,{t:t.value,ts:Date.now()}); document.getElementById("saved").textContent="Gespeichert"; });
  }
  if(state.tab==="mehr"){
    statusZeigen();
    document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();
      const et=document.getElementById("et").value||state.et, bi=document.getElementById("birth").value;
      if(et!==state.et) setzen("daten/et",{v:et,ts:Date.now()});
      if(bi!==state.birth) setzen("daten/birth",{v:bi,ts:Date.now()});
      state.et=et; state.birth=bi; state.week=null;
      document.getElementById("ok").textContent="Gespeichert";});
    const fs=document.getElementById("fs"), meld=s=>{document.getElementById("syncOk").textContent=s;};
    fs.addEventListener("submit",e=>{e.preventDefault();
      const db=document.getElementById("db").value.trim().replace(/\/$/,""), hid=document.getElementById("hid").value.trim();
      if(db&&!/^https:\/\//.test(db)){ meld("Die Datenbank-URL beginnt mit https://"); return; }
      if(hid&&hid.length<20){ meld("Der Code muss mindestens 20 Zeichen haben - so verlangen es die Firebase-Regeln."); return; }
      if(!db||!hid){ meld("Bitte Datenbank-URL und Code eintragen."); return; }
      cfg.db=db; cfg.hid=hid; store.set("sync",cfg); versuche=0; syncState="lokal"; verbinden(); render();
      document.getElementById("syncOk").textContent="Gespeichert, verbinde …";});
    fs.addEventListener("click",e=>{const b=e.target.closest("[data-act]"); if(!b) return;
      const hidEl=document.getElementById("hid");
      if(b.dataset.act==="code"){
        if(hidEl.value.trim()&&!confirm("Es steht schon ein Code im Feld. Wirklich einen neuen erzeugen? Das zweite Handy braucht dann auch den neuen.")) return;
        const a="abcdefghijkmnopqrstuvwxyz23456789"; let s=""; crypto.getRandomValues(new Uint8Array(24)).forEach(x=>s+=a[x%a.length]);
        hidEl.value=s; meld("Neuer Code - jetzt „Speichern und verbinden“ tippen.");
      }
      if(b.dataset.act==="kopieren"){
        (navigator.clipboard?navigator.clipboard.writeText(cfg.hid):Promise.reject()).then(()=>meld("Code kopiert."),()=>{hidEl.select();meld("Code markiert - jetzt kopieren.");});
      }
      if(b.dataset.act==="trennen"){
        if(!confirm("Sync auf diesem Gerät trennen? Die Notizen bleiben hier und in Firebase erhalten.")) return;
        cfg.db=""; cfg.hid=""; store.set("sync",cfg); verbinden(); render();
      }
    });
  }
}
function go(tab,week){ state.tab=tab; if(week!==undefined) state.week=week; render(); window.scrollTo(0,0); }
document.querySelector(".tabbar").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) go(b.dataset.tab);});
document.getElementById("view").addEventListener("click",e=>{
  const t=e.target;
  const wk=t.closest(".wk"); if(wk){state.week=+wk.dataset.w; render(); return;}
  const st=t.closest("[data-step]"); if(st){const s=+st.dataset.step; state.week=s===0?clampW(ageWeekNow()):clampW(state.week+s); render(); return;}
  const inf=t.closest("[data-item]"); if(inf){const it=ITEMS[+inf.dataset.item]; openTopic(it.topic,it.text,it.q); return;}
  const tp=t.closest("[data-topic]"); if(tp){openTopic(tp.dataset.topic); return;}
  const gt=t.closest("[data-goto]"); if(gt){go("woche",+gt.dataset.goto); return;}
  const jp=t.closest("[data-jump]"); if(jp){document.getElementById(jp.dataset.jump).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); return;}
});
document.addEventListener("keydown",e=>{ if(state.tab!=="woche"||dlg.open||/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==="ArrowLeft"){state.week=clampW(state.week-1);render();} if(e.key==="ArrowRight"){state.week=clampW(state.week+1);render();} });
const h=location.hash.replace("#",""); if(["woche","spruenge","notfall","mehr"].includes(h)) state.tab=h;
render();
verbinden();
if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
